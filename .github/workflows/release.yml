name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/froeling_s3100/manifest.json'))['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Build zip
        run: cd custom_components/froeling_s3100 && zip -r ../../froeling_s3100.zip . -x "*/__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: froeling_s3100.zip
