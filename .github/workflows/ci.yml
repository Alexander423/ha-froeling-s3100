name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff mypy pytest-homeassistant-custom-component
      - run: python tools/sync_library.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: mypy --strict --explicit-package-bases -p custom_components.froeling_s3100

  test-library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      - run: pytest tests/lib --cov=froeling_s3100 --cov-report=term-missing

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component pytest-cov
      - run: >
          pytest tests/ha -p no:cacheprovider
          --cov=custom_components.froeling_s3100
          --cov-config=.coveragerc-ha
          --cov-report=term-missing
          --cov-fail-under=95

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
